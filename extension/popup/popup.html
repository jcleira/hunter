<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #24292f;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 16px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
    }

    .header-icon {
      font-size: 24px;
      margin-right: 12px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
    }

    .header-subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 16px;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #d0d7de;
    }

    .setting:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-weight: 500;
    }

    .setting-description {
      font-size: 12px;
      color: #57606a;
      margin-top: 2px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d0d7de;
      transition: 0.2s;
      border-radius: 24px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
      background-color: #f97316;
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    .section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #d0d7de;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .status {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background-color: #f6f8fa;
      border-radius: 6px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-dot.active {
      background-color: #2da44e;
    }

    .status-dot.inactive {
      background-color: #d0d7de;
    }

    .footer {
      padding: 12px 16px;
      background-color: #f6f8fa;
      border-top: 1px solid #d0d7de;
      font-size: 12px;
      color: #57606a;
      text-align: center;
    }

    .footer a {
      color: #0969da;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🔍</span>
    <div>
      <div class="header-title">Hunter</div>
      <div class="header-subtitle">Git Blame for AI</div>
    </div>
  </div>

  <div class="content">
    <div class="setting">
      <div>
        <div class="setting-label">Enable Hunter</div>
        <div class="setting-description">Show AI attribution on GitHub</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting">
      <div>
        <div class="setting-label">Show Indicators</div>
        <div class="setting-description">Orange dots on AI-written lines</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="showIndicators" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting">
      <div>
        <div class="setting-label">Show Badges</div>
        <div class="setting-description">AI percentage in file headers</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="showBadges" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Current Page</div>
      <div class="status" id="status">
        <span class="status-dot inactive"></span>
        <span id="status-text">Not a GitHub page</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/arvos/hunter" target="_blank">Documentation</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/arvos/hunter/issues" target="_blank">Report Issue</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
